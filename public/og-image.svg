<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Dark background gradient -->
  <rect width="1200" height="630" fill="#0F0F1A"/>
  <circle cx="200" cy="100" r="300" fill="#7C3AED" fill-opacity="0.15" filter="blur(80px)"/>
  <circle cx="1000" cy="500" r="350" fill="#06B6D4" fill-opacity="0.12" filter="blur(80px)"/>

  <!-- Main Card container -->
  <rect x="100" y="80" width="1000" height="470" rx="32" fill="#16213E" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Privacy Badge -->
  <rect x="420" y="130" width="360" height="40" rx="20" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.3"/>
  <text x="600" y="156" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#34D399" text-anchor="middle">
    🔒 100% Client-Side &amp; Private · Fast Conversion
  </text>

  <!-- Big Title -->
  <text x="600" y="240" font-family="system-ui, sans-serif" font-size="64" font-weight="900" fill="url(#title_gradient)" text-anchor="middle">
    JSON ↔ CSV Converter
  </text>

  <!-- Subtitle -->
  <text x="600" y="295" font-family="system-ui, sans-serif" font-size="22" fill="#94A3B8" text-anchor="middle">
    Convert JSON to CSV or CSV to JSON instantly in your browser.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(230, 340)">
    <rect x="0" y="0" width="220" height="48" rx="24" fill="#000000" fill-opacity="0.3" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="110" y="30" font-family="system-ui, sans-serif" font-size="16" fill="#F1F5F9" text-anchor="middle">🗂️ Nested Object Flattening</text>

    <rect x="240" y="0" width="230" height="48" rx="24" fill="#000000" fill-opacity="0.3" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="355" y="30" font-family="system-ui, sans-serif" font-size="16" fill="#F1F5F9" text-anchor="middle">🔢 Smart Type Casting</text>

    <rect x="490" y="0" width="250" height="48" rx="24" fill="#000000" fill-opacity="0.3" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="615" y="30" font-family="system-ui, sans-serif" font-size="16" fill="#F1F5F9" text-anchor="middle">⚡ Zero Server Uploads</text>
  </g>

  <!-- Footer link -->
  <text x="600" y="475" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#06B6D4" text-anchor="middle">
    https://pdv-to-json.vercel.app
  </text>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="title_gradient" x1="200" y1="200" x2="1000" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1F5F9"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
</svg>
