name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs at 12:00 UTC every 3 days (well within Supabase 7-day pause window)
    - cron: '0 12 */3 * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping:
    name: Ping Database & Reset Inactivity
    runs-on: ubuntu-latest
    steps:
      - name: Ping DevKit Keep-Alive Endpoint
        run: |
          echo "Sending keep-alive request to DevKit API..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "https://dev-kit.tech/api/cron/keep-alive")
          HTTP_BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')

          echo "Response Body: $HTTP_BODY"
          echo "Status Code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Keep-alive ping succeeded! Supabase inactivity timer reset."
            exit 0
          else
            echo "⚠️ Warning: Keep-alive returned HTTP $HTTP_STATUS"
            # Do not fail workflow completely on network flukes to prevent spam
            exit 0
          fi
